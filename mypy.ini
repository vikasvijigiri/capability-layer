# Type checking for the hook and tool scripts. Enabled 2026-08-03.
#
# `typecheck` had been `false` in .claude/project-checks.json on the assumption
# that an unannotated codebase would produce hundreds of findings. Measured
# instead of assumed: six errors across nineteen files, all one pattern
# (`spec_from_file_location` returning `ModuleSpec | None`), all real, all fixed
# with asserts that improve the failure message. The assumption was wrong.
#
# `_projectchecks.detect_checks` looks for this file by name, so its existence is
# what turns type checking on. A fresh clone without mypy installed skips the
# check with a note rather than failing -- see `tool_missing`.

[mypy]
python_version = 3.11
files = .claude/hooks, tools

# The hooks load each other by path at runtime, and the suites load the modules
# under test the same way. mypy cannot follow that, and the alternative is a
# stub package for code that is already in this repo.
ignore_missing_imports = True

# Deliberately not strict. The goal is catching real defects in untyped code --
# a None flowing where an object is expected, an attribute that cannot exist --
# not annotating nineteen files to satisfy a checker. `disallow_untyped_defs`
# would turn six findings into several hundred overnight, and a gate that noisy
# is one people route around.
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True

# Hooks end in `except Exception: pass` on purpose; that is not dead code.
warn_no_return = False

[mypy-docs.archive.*]
ignore_errors = True
